plugins {
    id "com.android.application"
}

android {
    namespace "com.solarassistant.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.solarassistant.mobile"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "1.6.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
